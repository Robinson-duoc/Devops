apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: TU_ID_AWS_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/front-despacho:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  # Al usar LoadBalancer en AWS EKS, creará un Classic Load Balancer automáticamente
  type: LoadBalancer